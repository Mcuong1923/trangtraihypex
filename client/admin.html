<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản trị trại Hypex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Trang quản trị: cuộn dọc bình thường, dùng chung bảng màu với game. */
  body{overflow:auto;-webkit-user-select:text;user-select:text}
  .wrap{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .top h1{flex:1}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--panel);border:2px solid var(--wood);border-radius:14px;padding:10px 12px}
  .kpi b{display:block;font:800 1.5rem var(--font);font-variant-numeric:tabular-nums}
  .kpi span{font-size:.78rem;color:var(--ink-soft);font-weight:700}
  .panel{background:var(--panel);border:2px solid var(--wood);border-radius:16px;padding:14px;margin-bottom:14px}
  .panel h2{margin-top:0}
  table.t td,table.t th{vertical-align:top}
  .pill{font-size:.7rem;font-weight:900;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
  .open{background:var(--bad)} .actioned{background:var(--good)} .dismissed{background:#8a8a8a}
  .form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .form>div{display:flex;flex-direction:column;gap:4px;min-width:0}
  .form input,.form select{padding:9px 10px;border-radius:10px;border:2px solid var(--line);font:600 .92rem var(--font-ui);background:#fff;color:var(--ink)}
  .ev{font-size:.78rem;color:var(--ink-soft);margin:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="panel" style="max-width:420px;margin:40px auto">
    <h1>Quản trị trại Hypex</h1>
    <p class="mut">Đăng nhập bằng tài khoản được cấp quyền (cờ <code>-staff</code> của máy chủ).</p>
    <form id="lf" class="form" style="flex-direction:column;align-items:stretch">
      <div><label class="l" for="lu">Tên đăng nhập</label><input id="lu" autocomplete="username"></div>
      <div><label class="l" for="lp">Mật khẩu</label><input id="lp" type="password" autocomplete="current-password"></div>
      <p class="err" id="lerr"></p>
      <button class="btn">Đăng nhập</button>
    </form>
  </div>

  <div id="adminApp" hidden>
    <div class="top"><h1>Quản trị trại Hypex</h1><span class="mut" id="who"></span><button class="mini sec" id="refresh">Làm mới</button><button class="mini sec" id="logout">Đăng xuất</button></div>
    <div class="cards" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
